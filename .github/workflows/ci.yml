name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npx vitest run src/test/security/

      # NOTE: src/test/components/, src/test/hooks/, and src/test/integration/
      # contain pre-existing failures unrelated to this remediation work
      # (Supabase mock setup issues in the React component tests).
      # Those are tracked separately and intentionally excluded here so that
      # this CI gate reflects only the security invariants added in this PR.

      - name: Build
        run: npm run build
